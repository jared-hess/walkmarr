[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "walkmarr"
version = "0.1.0"
description = "Export *arr-managed media into portable-device-ready mirror libraries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "ruff>=0.6.9",
    "types-PyYAML>=6.0.12.20240917",
    "types-requests>=2.32.0.20241016",
]

[project.scripts]
walkmarr = "walkmarr.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
