providers:
  sonarr:
    url: "http://localhost:8989"
    api_key_env: "SONARR_API_KEY"

  radarr:
    url: "http://localhost:7878"
    api_key_env: "RADARR_API_KEY"

path_mappings:
  - remote: "/shows"
    local: "/mnt/media/shows"

  - remote: "/movies"
    local: "/mnt/media/movies"

output_roots:
  shows: "/mnt/walkmarr/shows"
  movies: "/mnt/walkmarr/movies"

staging:
  mode: "auto"
  directory: "/tmp/walkmarr-staging"

queue:
  workers: 1
  continue_on_error: true
  start_paused: false
  default_mode: "missing_only"
  remember_completed_until_exit: true

artwork:
  enabled: true
  providers:
    itunes_tv_season:
      enabled: true
      apply_to:
        - tv
      country: "US"
      image_size: 320
      timeout_seconds: 10
      minimum_confidence: "parsed"
      sonarr_fallback:
        enabled: true
      radarr_fallback:
        enabled: true

default_profiles:
  sonarr: "live_action"
  radarr: "movie"

genre_profile_map:
  sonarr:
    - genres: ["animation", "anime"]
      profile: "animation"

  radarr:
    - genres: ["animation", "anime"]
      profile: "animation"

profiles:
  animation:
    crf: 30
    maxrate_floor_kbps: 250
    maxrate_cap_kbps: 768
    bufsize_kbps: 1500
    bitrate_multiplier: 1.5
    audio_bitrate_mono_kbps: 160
    audio_bitrate_stereo_kbps: 160
    max_width: 320
    h264_profile: "baseline"
    h264_level: "1.3"
    preferred_audio_languages: ["eng"]

  live_action:
    crf: 30
    maxrate_floor_kbps: 250
    maxrate_cap_kbps: 768
    bufsize_kbps: 1500
    bitrate_multiplier: 1.5
    audio_bitrate_mono_kbps: 160
    audio_bitrate_stereo_kbps: 160
    max_width: 320
    h264_profile: "baseline"
    h264_level: "1.3"
    preferred_audio_languages: ["eng"]

  movie:
    crf: 30
    maxrate_floor_kbps: 250
    maxrate_cap_kbps: 768
    bufsize_kbps: 1500
    bitrate_multiplier: 1.5
    audio_bitrate_mono_kbps: 160
    audio_bitrate_stereo_kbps: 160
    max_width: 320
    h264_profile: "baseline"
    h264_level: "1.3"
    preferred_audio_languages: ["eng"]

overrides:
  sonarr:
    "The Simpsons":
      profile: "animation"
      specials_show_name: "The Simpsons Shorts"

    "Futurama":
      profile: "animation"

    "Arrested Development":
      profile: "live_action"

  radarr:
    "American Psycho":
      profile: "movie"
