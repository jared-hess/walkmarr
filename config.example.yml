providers:
  sonarr:
    url: "http://localhost:8989"
    api_key_env: "SONARR_API_KEY"

  radarr:
    url: "http://localhost:7878"
    api_key_env: "RADARR_API_KEY"

path_mappings:
  - remote: "Z:/shows"
    local: "/mnt/z/shows"

  - remote: "Z:/movies"
    local: "/mnt/z/movies"

  - remote: "/tv"
    local: "/mnt/z/shows"

  - remote: "/movies"
    local: "/mnt/z/movies"

output_roots:
  tv: "/mnt/d/ipod/shows"
  movies: "/mnt/d/ipod/movies"

default_profiles:
  sonarr: "animation"
  radarr: "movie"

profiles:
  animation:
    crf: 30
    maxrate_floor_kbps: 250
    maxrate_cap_kbps: 1200
    bitrate_multiplier: 1.5
    audio_bitrate_mono_kbps: 64
    audio_bitrate_stereo_kbps: 96
    max_width: 640
    h264_profile: "baseline"
    h264_level: "3.0"

  live_action:
    crf: 28
    maxrate_floor_kbps: 350
    maxrate_cap_kbps: 1500
    bitrate_multiplier: 1.5
    audio_bitrate_mono_kbps: 64
    audio_bitrate_stereo_kbps: 96
    max_width: 640
    h264_profile: "baseline"
    h264_level: "3.0"

  movie:
    crf: 27
    maxrate_floor_kbps: 400
    maxrate_cap_kbps: 1500
    bitrate_multiplier: 1.5
    audio_bitrate_mono_kbps: 64
    audio_bitrate_stereo_kbps: 96
    max_width: 640
    h264_profile: "baseline"
    h264_level: "3.0"

overrides:
  sonarr:
    "The Simpsons":
      profile: "animation"
      specials_show_name: "The Simpsons Shorts"

    "Futurama":
      profile: "animation"

    "Arrested Development":
      profile: "live_action"

  radarr:
    "American Psycho":
      profile: "movie"
